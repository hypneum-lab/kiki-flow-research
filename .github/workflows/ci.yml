name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # setup-uv v10 bundles @actions/cache 4.x (cache service v2), so the
      # uv cache works again (v3 hit HTTP 400 on the retired v1 service).
      # uv itself is pinned and sha256-verified (aarch64-apple-darwin;
      # bump version + checksum together, after HITL review).
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.1"
          checksum: "cfe454573412ff7380d15fc7dae5997ab53ffce72fce0a78e91ddbc84001acd2"
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --group labeler-models
      # espeak-ng (GPL-3.0-or-later, CI/test-only, not redistributed) is
      # built from the pinned upstream source archive, sha256-verified in
      # scripts/ci/build_espeak_ng.sh. Needed by phonemizer.
      - name: Set espeak-ng prefix
        run: echo "ESPEAK_NG_PREFIX=$HOME/espeak-ng-1.52.0" >> "$GITHUB_ENV"
      - name: Cache espeak-ng build
        id: espeak-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/espeak-ng-1.52.0
          key: espeak-ng-1.52.0-bb4338102ff3b49a81423da8a1a158b420124b055b60fa76cfb4b18677130a23-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/build_espeak_ng.sh') }}
      - name: Build espeak-ng
        if: steps.espeak-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/build_espeak_ng.sh "$ESPEAK_NG_PREFIX"
      - name: Point phonemizer at espeak-ng
        run: |
          echo "PHONEMIZER_ESPEAK_LIBRARY=$ESPEAK_NG_PREFIX/lib/libespeak-ng.dylib" >> "$GITHUB_ENV"
      - name: Check labeler test prerequisites
        run: |
          uv run python -c "
          import spacy
          from phonemizer.backend import EspeakBackend
          assert spacy.util.is_package('fr_core_news_lg'), 'fr_core_news_lg missing'
          assert EspeakBackend.is_available(), 'espeak-ng library missing'
          print('fr_core_news_lg', spacy.util.get_package_version('fr_core_news_lg'))
          print('espeak-ng', EspeakBackend.version(), EspeakBackend.library())
          "
      - run: uv run ruff check .
      - run: uv run mypy kiki_flow_core
      - run: uv run pytest -v --cov=kiki_flow_core --cov-fail-under=0  # TODO(Task 11): bump to --cov-fail-under=80
      - name: Validate doc-truth (N4 Task 5)
        continue-on-error: true
        run: uv run python scripts/check_status_truth.py
      - name: Reproducibility double-run
        if: hashFiles('tests/test_smoke_e2e.py') != ''
        run: |
          uv run pytest tests/test_smoke_e2e.py::test_double_run_deterministic -v
